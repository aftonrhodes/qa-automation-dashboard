name: Python Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest-playwright
        playwright install-deps
        playwright install chromium

  test:
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"
    # Even if you install in build, for clean isolation, 
    # we repeat the environment setup for the test job.
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install playwright pytest-playwright
        playwright install chromium
    - name: Run Tests
      run: pytest